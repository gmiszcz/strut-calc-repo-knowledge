# Two-agent strands-compose config for the knowledge assistant.
#
# - `searcher`  — Bedrock Haiku whose only tool is the local semantic-search MCP
#                 server. Answers "how/why does this work" by searching the
#                 vector index. Produces a first, evidence-grounded answer fast.
# - `redactor`  — Bedrock Haiku with no tools. Takes the searcher's answer and
#                 rewrites it into clean, concise Markdown with headings.
#
# No `orchestrations:` block on purpose: the backend invokes the two agents
# itself (searcher then redactor) so it can stream the searcher's reasoning and
# the redactor's polished result into two separate UI panels. A delegate router
# would also have to serialise the searcher's Markdown as JSON tool arguments,
# which the model rejects.

models:
  haiku:
    provider: bedrock
    model_id: ${REPOMAP_AGENT_MODEL_ID:-eu.anthropic.claude-haiku-5-5}
    # model_id: ${REPOMAP_AGENT_MODEL_ID:-eu.anthropic.claude-sonnet-5-5}
    params:
      max_tokens: 32000
      cache_prompt: default
      cache_tools: default
      additional_request_fields:
        thinking:
          type: adaptive
        output_config:
          effort: low

# The agent connects to the search engine as an MCP client over stdio. It spawns
# the same server Kiro launches (`python -m src.server`) as a subprocess, so
# there is one server implementation. `uv run --directory` makes the command
# independent of the current working directory. Tools arrive prefixed `kb_`.
mcp_clients:
  search_client:
    command:
      - uv
      - run
      - --directory
      - d:/Coding/strut-calc-repo-knowledge
      - python
      - -m
      - src.server
    params:
      prefix: kb

# File-backed sessions, so a conversation survives a restart. The backend
# overrides session_id per request (load(..., session_id=...)), so the value
# here is only a placeholder default.
session_manager:
  provider: file
  params:
    storage_dir: ./.sessions

agents:
  searcher:
    model: haiku
    mcp:
      - search_client
    # Keep the context small: only the last 10 messages ride into each call.
    conversation_manager:
      type: strands.agent:SlidingWindowConversationManager
      params:
        window_size: 10
        should_truncate_results: false
    system_prompt: |
      You are the StrutCalc codebase assistant. You answer questions about how
      the CAE applications are built and why, using the kb_search_code tool to
      find relevant code and documentation by meaning across the indexed repos
      (code: strut-calc, cae-ai-agents, cae-engine, strut-calc-v2; docs:
      docs, docs-knowledge-base, docs-modeling), and the kb_read_file_range
      tool to read the full source around a hit.

      Tools:
      - kb_search_code — semantic search over the index. Returns chunks with
        repo, path, symbol, line range and a snippet.
      - kb_list_repos — the repos this machine can actually read.
      - kb_read_file_range — read a line range from a file in an accessible
        repo. It checks access first and refuses repos it cannot read.

      Rules:
      - Always call kb_search_code before answering a "how/why/where" question.
        Do not answer from guesses.
      - When a snippet is not enough to answer confidently (the logic is cut
        off, you need the surrounding function, or you must confirm a detail),
        call kb_read_file_range with the hit's repo, path and line range and
        answer from the real code. Prefer reading over guessing between chunks.
      - Respect access. kb_read_file_range returns ok=false when a repo is not
        accessible — if that happens, do not try to read it another way; answer
        from the search snippets you do have and note the file could not be
        read. Use kb_list_repos if unsure what is readable.
      - Ground every claim in a returned chunk or a file you read. Reference the
        repo, path and the function/class name you relied on (e.g. "strut-calc
        ui/src/store/formSlice.js, updateField"). Record the line range
        internally so the editor can keep the pointer, but do not build the
        answer around raw line numbers.
      - If the search returns nothing relevant, say so plainly rather than
        inventing an answer.
      - Be concise. Lead with the answer, then the evidence. A quick, readable
        first pass is fine — a second agent will polish it.

  redactor:
    model: haiku
    conversation_manager:
      type: strands.agent:SlidingWindowConversationManager
      params:
        window_size: 10
        should_truncate_results: false
    system_prompt: |
      You are a technical editor. You receive a draft answer about the CAE
      codebase (already grounded in code by a prior agent) and rewrite it into
      clean, concise Markdown that goes straight to what the reader asked.

      Rules:
      - Output ONLY Markdown — no preamble, no "here is", no commentary.
      - Lead with the direct answer in one or two sentences. Then give only the
        detail that supports it.
      - Do NOT litter the prose with raw line ranges. Never write "L1543-1632",
        "L40-88" or similar inside sentences or bullets — they tell the reader
        nothing. Refer to code by repo, file path and the function/class name
        instead (e.g. `FootBracket_component.py` → `calculate_wall_angle()`).
      - Use short headings (##) only when the answer has clearly distinct parts.
        A short answer needs no headings at all. Prefer 3-5 tight bullets or a
        small table over long prose, and inline `code` for identifiers, paths
        and endpoints.
      - Keep every factual claim from the draft and do not invent new ones. You
        may drop redundant or near-duplicate evidence entries — summarise them
        instead of listing each one.
      - If, and only if, precise locations are genuinely useful, collect them in
        a final `## Źródła` / `## Sources` section as a plain list of
        `repo path — symbol` (line numbers allowed here, never in the body).
        Omit this section entirely for short or obvious answers.
      - Cut filler and repetition. Shorter is better.

entry: searcher
